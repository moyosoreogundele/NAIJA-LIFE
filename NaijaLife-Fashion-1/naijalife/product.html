<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/icon.svg">
<meta name="theme-color" content="#111111">
<title id="pageTitle">Product — NaijaLife Fashion</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
<style>
  .pd-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; padding: 40px 0 20px; }
  .pd-gallery-main { border-radius: var(--radius-lg); overflow: hidden; aspect-ratio: 4/5; border: 1px solid var(--border); margin-bottom: 12px; }
  .pd-gallery-main img { width: 100%; height: 100%; object-fit: cover; }
  .pd-thumbs { display: flex; gap: 10px; }
  .pd-thumbs img { width: 76px; height: 92px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); cursor: pointer; opacity: .6; }
  .pd-thumbs img.active { opacity: 1; border-color: var(--gold); }
  .pd-seller-line { font-size: 0.85rem; color: var(--gold-light); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .pd-rating { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; color: var(--gray); margin: 10px 0 18px; }
  .pd-rating svg { width: 15px; height: 15px; fill: var(--gold); color: var(--gold); }
  .pd-price-row { display: flex; align-items: baseline; gap: 12px; margin-bottom: 22px; }
  .pd-price-row .now { font-size: 1.7rem; font-weight: 700; font-family: var(--font-display); }
  .pd-price-row .old { color: var(--gray-dim); text-decoration: line-through; }
  .option-block { margin-bottom: 22px; }
  .option-block .label-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.85rem; font-weight: 600; }
  .option-block .label-row button { color: var(--gold-light); font-size: 0.8rem; font-weight: 500; }
  .opt-row { display: flex; flex-wrap: wrap; gap: 9px; }
  .opt-chip { padding: 9px 16px; border-radius: 999px; border: 1px solid var(--border-strong); font-size: 0.85rem; color: var(--gray); }
  .opt-chip.active { border-color: var(--gold); color: var(--gold-light); background: rgba(212,175,55,.1); }
  .qty-stepper { display: inline-flex; align-items: center; border: 1px solid var(--border-strong); border-radius: 999px; overflow: hidden; }
  .qty-stepper button { width: 40px; height: 40px; background: var(--surface); color: var(--cream); border: none; }
  .qty-stepper span { width: 40px; text-align: center; font-weight: 600; }
  .pd-actions { display: flex; gap: 12px; margin: 26px 0; }
  .pd-actions .btn { flex: 1; }
  .pd-meta-row { display: flex; gap: 24px; padding: 18px 0; border-top: 1px solid var(--border); font-size: 0.84rem; color: var(--gray); }
  .pd-meta-row .item { display: flex; align-items: center; gap: 8px; }
  .tabs { border-top: 1px solid var(--border); margin-top: 32px; }
  .tab-btns { display: flex; gap: 28px; border-bottom: 1px solid var(--border); }
  .tab-btns button { padding: 16px 0; color: var(--gray); font-weight: 600; font-size: 0.9rem; border-bottom: 2px solid transparent; }
  .tab-btns button.active { color: var(--cream); border-color: var(--gold); }
  .tab-panel { display: none; padding: 22px 0; font-size: 0.92rem; color: var(--gray); line-height: 1.7; }
  .tab-panel.active { display: block; }
  .review-item { padding: 18px 0; border-bottom: 1px solid var(--border); }
  .review-head { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.88rem; color: var(--cream); font-weight: 600; }
  .rating-stars { color: var(--gold); font-size: 0.8rem; }
  .rating-bar-row { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; color: var(--gray); margin-bottom: 6px; }
  .rating-bar-track { flex: 1; height: 6px; background: var(--surface-light); border-radius: 999px; overflow: hidden; }
  .rating-bar-fill { height: 100%; background: var(--gold); }
  @media (max-width: 900px) {
    .pd-layout { grid-template-columns: 1fr; gap: 24px; padding-top: 20px; }
  }
</style>
</head>
<body>

<header class="site-header" id="site-header"></header>

<main class="container" id="pdContainer"></main>

<section class="container" style="border-top:1px solid var(--border); padding-top:48px;">
  <div class="section-head"><h2 class="display-3">You may also like</h2></div>
  <div class="product-grid" id="relatedGrid"></div>
</section>

<footer class="site-footer" id="site-footer"></footer>
<div class="bottom-nav" id="bottom-nav"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/product.js"></script>
</body>
</html>
